<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ramen y Sōyu - Mangas y Cómics</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#020817 0%,#0f172a 100%);color:#e2e8f0;font-family:Arial,sans-serif}
.container{max-width:1200px;margin:0 auto;padding:20px}
.topbar{background:#1e293b;padding:20px 0;position:sticky;top:0;z-index:10}
.topbar-inner{display:flex;justify-content:space-between;align-items:center}
.brand{font-size:1.8rem;font-weight:bold;color:#f59e0b}
.brand-icon{margin-right:10px}
.nav-links{display:flex;gap:20px}
.nav-links a{color:#e2e8f0;text-decoration:none;font-weight:600}
.nav-links a:hover{color:#f59e0b}
.hero{padding:40px 0;text-align:center}
.hero h1{font-size:2.5rem;margin:0 0 10px;color:#f59e0b}
.hero p{color:#cbd5e1;font-size:1.1rem;margin:0}
.section-title{font-size:2rem;margin:40px 0 20px;color:#f59e0b}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;margin:30px 0 60px}
.card{background:rgba(30,41,59,0.8);border:1px solid rgba(148,163,184,0.2);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform 0.3s}
.card:hover{transform:translateY(-5px)}
.card-img{width:100%;height:320px;object-fit:cover}
.card-body{padding:20px}
.card-body h3{margin:15px 0 10px;font-size:1.4rem}
.card-body p{margin:8px 0;color:#cbd5e1;line-height:1.5}
.badge{display:inline-block;background:rgba(167,139,250,0.2);color:#ddd6fe;padding:6px 12px;border-radius:999px;font-size:0.8rem;font-weight:bold;margin-bottom:10px}
.meta{color:#fbbf24;font-weight:600;font-size:0.9rem}
.empty{text-align:center;padding:40px;color:#cbd5e1}
.error{color:#ff6b6b;text-align:center}
footer{background:#1e293b;padding:30px 0;text-align:center;color:#cbd5e1;border-top:1px solid rgba(148,163,184,0.2)}
</style>
</head>
<body>
<div class="topbar">
<div class="container">
<div class="topbar-inner">
<div class="brand"><span class="brand-icon">🍜</span>Ramen y Sōyu</div>
<div class="nav-links">
<a href="/ramenysoju/">Inicio</a>
<a href="/ramenysoju/admin/">🔐 Admin</a>
</div>
</div>
</div>
</div>

<div class="container">
<div class="hero">
<h1>Bienvenido a Ramen y Sōyu</h1>
<p>Tu plataforma para leer mangas y cómics. Aquí encontrarás historias fascinantes esperándote.</p>
</div>

<h2 class="section-title">📚 Catálogo de Mangas y Cómics</h2>
<div class="grid" id="mangaGrid">
<div class="empty">Cargando mangas...</div>
</div>
</div>

<footer>
<div class="container">
<p>&copy; 2024 Ramen y Sōyu. Creado con ❤️ para ti.</p>
</div>
</footer>

<script>
async function cargarMangas(){
try{
const res=await fetch('/ramenysoju/data/mangas.json');
if(!res.ok) throw new Error('No se pudo cargar el archivo');
const data=await res.json();
const grid=document.getElementById('mangaGrid');
grid.innerHTML='';

if(!data.mangas || data.mangas.length===0){
grid.innerHTML='<div class="empty">No hay mangas disponibles aún.</div>';
return;
}

data.mangas.forEach(manga=>{
const card=document.createElement('div');
card.className='card';
card.innerHTML=`
<img src="${manga.cover}" alt="${manga.title}" onerror="this.src='https://via.placeholder.com/300x400?text=Sin+Portada'">
<div class="card-body">
<span class="badge">${manga.genre}</span>
<h3>${manga.title}</h3>
<p class="meta">Por ${manga.author}</p>
<p>${manga.summary.substring(0,100)}...</p>
<p class="meta">Estado: ${manga.status}</p>
</div>
`;
card.onclick=()=>window.location.href=`/ramenysoju/detail.html?manga=${manga.slug}`;
grid.appendChild(card);
});
}catch(e){
console.error(e);
document.getElementById('mangaGrid').innerHTML='<div class="error">Error cargando los mangas. Intenta más tarde.</div>';
}
}

cargarMangas();
</script>
</body>
</html>
