<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramen y Sōyu - Mangas y Cómics</title>
    <style>
        * { box-sizing: border-box; }
        :root {
            --bg: #0f172a;
            --text: #e2e8f0;
            --highlight: #f59e0b;
        }
        body {
            margin: 0;
            font-family: "Inter", sans-serif;
            background: linear-gradient(180deg, #020817 0%, #0f172a 100%);
            color: var(--text);
        }
        .container { width: min(1150px, calc(100% - 32px)); margin: 0 auto; }
        .topbar { position: sticky; top: 0; z-index: 10; backdrop-filter: blur(12px); background: rgba(2, 6, 23, 0.72); border-bottom: 1px solid rgba(148, 163, 184, 0.2); }
        .nav-wrap { display: flex; align-items: center; justify-content: space-between; min-height: 72px; }
        .brand { font-weight: 700; letter-spacing: 0.02em; }
        .brand-mark { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 10px; background: linear-gradient(135deg, var(--highlight), #f97316); color: #111827; font-weight: 800; }
        .hero { padding: 64px 0 40px; }
        .hero h1 { margin: 0 0 18px; font-size: 3rem; }
        .hero p { color: #cbd5e1; max-width: 620px; line-height: 1.8; }
        .section-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 52px 0 24px; }
        .section-head h2 { margin: 0; font-size: 2rem; }
        .catalog-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; padding-bottom: 48px; }
        .manga-card { overflow: hidden; background: rgba(15, 23, 42, 0.68); border: 1px solid rgba(148, 163, 184, 0.2); border-radius: 18px; cursor: pointer; }
        .manga-card img { width: 100%; height: 280px; object-fit: cover; }
        .manga-card__body { padding: 18px; }
        .manga-card h3 { margin: 0 0 12px; font-size: 1.5rem; }
        .manga-card p { margin: 0; color: #cbd5e1; line-height: 1.7; }
        .badge { display: inline-block; padding: 6px 10px; border-radius: 999px; background: rgba(167, 139, 250, 0.12); color: #ddd6fe; font-size: 0.75rem; font-weight: 700; }
        .site-footer { border-top: 1px solid rgba(148, 163, 184, 0.2); background: rgba(2, 6, 23, 0.72); padding: 20px 0; text-align: center; color: #cbd5e1; }
        .button-admin { display: inline-block; padding: 10px 20px; background: linear-gradient(135deg, var(--highlight), #f97316); color: #111827; border-radius: 8px; font-weight: 700; text-decoration: none; margin-top: 12px; }
        @media (max-width: 900px) { .catalog-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="container">
            <div class="nav-wrap">
                <div class="brand"><span class="brand-mark">🍜</span> Ramen y Sōyu</div>
                <a href="/ramenysoju/admin/" class="button-admin">Panel Admin</a>
            </div>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="container">
                <h1>Bienvenido a Ramen y Sōyu</h1>
                <p>Tu espacio favorito para leer mangas y cómics. Sumérgete en historias fascinantes, personajes memorables y mundos extraordinarios.</p>
            </div>
        </section>

        <section class="catalog">
            <div class="container">
                <div class="section-head">
                    <h2>Catálogo de Mangas</h2>
                </div>
                <div class="catalog-grid" id="mangaGrid">
                    <div class="empty-state">Cargando mangas...</div>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2024 Ramen y Sōyu. Todos los mangas y cómics aquí. Creado con ❤️</p>
        </div>
    </footer>

    <script>
        async function loadMangas() {
            try {
                const response = await fetch('/ramenysoju/data/mangas.json');
                const data = await response.json();
                const grid = document.getElementById('mangaGrid');
                grid.innerHTML = '';

                data.mangas.forEach(manga => {
                    const card = document.createElement('div');
                    card.className = 'manga-card';
                    card.innerHTML = `
                        <img src="${manga.cover}" alt="${manga.title}">
                        <div class="manga-card__body">
                            <span class="badge">${manga.genre}</span>
                            <h3>${manga.title}</h3>
                            <p>${manga.summary.substring(0, 100)}...</p>
                            <p><strong>Autor:</strong> ${manga.author}</p>
                            <p><strong>Estado:</strong> ${manga.status}</p>
                        </div>
                    `;
                    card.addEventListener('click', () => {
                        window.location.href = `/ramenysoju/detail.html?manga=${manga.slug}`;
                    });
                    grid.appendChild(card);
                });
            } catch (error) {
                console.error('Error cargando mangas:', error);
                document.getElementById('mangaGrid').innerHTML = '<div class="empty-state">Error cargando los mangas. Intenta más tarde.</div>';
            }
        }

        loadMangas();
    </script>
</body>
</html>
